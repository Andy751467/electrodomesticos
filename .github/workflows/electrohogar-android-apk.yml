name: ElectroHogar - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/electrohogar-android-apk.yml'

permissions:
  contents: read

jobs:
  generar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Preparar Android
        working-directory: flutter_app
        run: |
          flutter config --enable-android
          flutter create --platforms=android --org com.electrohogar --project-name electrohogar_mobile .
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Comprobar código Dart
        working-directory: flutter_app
        run: |
          dart format --output=none --set-exit-if-changed lib || echo "Se recomienda dar formato al código; se continúa compilando."
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK de prueba
        working-directory: flutter_app
        run: flutter build apk --debug --no-pub

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ElectroHogar-APK-Android
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
