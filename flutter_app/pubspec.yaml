name: electrohogar_mobile
description: Aplicacion movil Flutter para ElectroHogar.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo-electrohogar.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo-electrohogar.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo-electrohogar.jpg
  min_sdk_android: 21
